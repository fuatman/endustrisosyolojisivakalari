<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endüstri Sosyolojisi Vakaları</title>
<style>
:root{--bg:#f4f6f9;--surface:#ffffff;--ink:#1c2836;--muted:#566476;--line:#d5dbe4;--accent:#9a5b0c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--surface:#1b2431;--ink:#e8edf4;--muted:#a3afbf;--line:#2f3b4b;--accent:#f0b35c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;--surface:#1b2431;--ink:#e8edf4;--muted:#a3afbf;--line:#2f3b4b;--accent:#f0b35c;color-scheme:dark}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 6px}
.lead{color:var(--muted);margin:0 0 20px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;margin:12px 0}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a.card b{display:block;font-size:1.05rem}
a.card span{color:var(--muted);font-size:.93rem}
</style>
</head>
<body>
<main>
<h1>Endüstri Sosyolojisi Vakaları</h1>
<p class="lead">Derste kullanacağımız örnek olaylar. Hocanızın verdiği vakayı seçin.</p>

<a class="card" href="aydinlanma.html"><b>Yıldız Fırın’da Yeni Dönem</b><span>Aydınlanma ve modern çalışma dünyası</span></a>

<!-- Yeni vaka eklemek için yukarıdaki satırı kopyalayıp href ve başlıkları değiştirin -->
</main>
</body>
</html>
